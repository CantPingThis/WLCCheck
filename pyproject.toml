[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "wlccheck"
version = "0.1.0"
description = "Pre/post change verification tool for Cisco 9800 Wireless LAN Controllers via RESTCONF"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "requests>=2.28.0",
    "textual>=0.60.0",
    "urllib3>=1.26.0",
]

[project.scripts]
wlccheck = "wlccheck.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["wlccheck*"]

[tool.setuptools.package-data]
"wlccheck.tui" = ["*.tcss"]
