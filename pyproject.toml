[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wlccheck"
version = "0.2.0.dev0"
description = "Pre/post change verification tool for Cisco 9800 Wireless LAN Controllers via RESTCONF"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "ncclient>=0.7.1",
    "requests>=2.28.0",
    "scrapli[paramiko]>=2026.2.20",
    "textual>=0.60.0",
    "urllib3>=1.26.0",
]

[project.scripts]
wlccheck = "wlccheck.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["wlccheck*"]

[tool.setuptools.package-data]
"wlccheck.tui" = ["*.tcss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=wlccheck.core --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
omit = ["wlccheck/tui/*", "wlccheck/__main__.py", "wlccheck/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
]
